[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg4vd"
version = "1.0.0"
description = "Multimodal knowledge graph construction and query for visually rich documents"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KG4VD team" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tenacity>=8.2",
    "openai>=1.40",
    "numpy>=1.26",
    "pillow>=10",
    "json-repair>=0.25",
    "networkx>=3.2",
    "nano-vectordb>=0.0.4",
    "pypdfium2>=4.30",
    "tqdm>=4.66",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# MinerU 3.x runs out-of-process in its own conda env (it needs
# transformers>=4.57, which conflicts with the gme pin), so it is NOT installed
# into this env - see services/mineru/README.md. Kept empty so existing
# `pip install kg4vd[mineru,...]` commands still resolve.
mineru     = []
# GME-Qwen2-VL ships a remote-code `modeling_gme_qwen2vl.py` that
# asserts transformers<4.52.0; pin to keep `pip install kg4vd[gme]`
# working out of the box.
gme        = ["torch>=2.3", "transformers>=4.51,<4.52", "accelerate>=0.30"]
viz        = ["matplotlib>=3.8"]   # scripts/inspect_run.py graph rendering
dev        = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
all        = ["kg4vd[mineru,gme,viz,dev]"]

[project.scripts]
kg4vd = "kg4vd.cli:app"

# Plugin entry points used by the registry.
[project.entry-points."kg4vd.encoders"]
mock              = "kg4vd.encode.mock:MockEncoder"
gme_qwen2vl       = "kg4vd.encode.gme_qwen2vl:GMEQwen2VLEncoder"

[project.entry-points."kg4vd.indices"]
nano    = "kg4vd.index.nano:NanoUnifiedIndex"

[project.entry-points."kg4vd.llms"]
openai     = "kg4vd.llm.openai_native:OpenAILLM"
openrouter = "kg4vd.llm.openrouter:OpenRouterLLM"
vllm       = "kg4vd.llm.vllm_openai:VLLMOpenAILLM"
sglang     = "kg4vd.llm.sglang_openai:SGLangLLM"
mock       = "kg4vd.llm.mock:MockLLM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg4vd = ["config/presets/*.yaml", "query/prompts/default/*.md", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
